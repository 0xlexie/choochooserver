- name: Install Nginx
  ansible.builtin.dnf:
    name: nginx
    state: present

- name: Check SELinux mode
  ansible.builtin.command:
    cmd: getenforce
  register: nginx_selinux_mode
  changed_when: false
  failed_when: false

- name: Read SELinux network access setting for Nginx
  ansible.builtin.command:
    cmd: getsebool httpd_can_network_connect
  register: nginx_selinux_network_connect
  changed_when: false
  when:
    - nginx_selinux_mode.rc == 0
    - nginx_selinux_mode.stdout in ["Enforcing", "Permissive"]

- name: Allow Nginx to connect to its upstreams under SELinux
  ansible.builtin.command:
    cmd: setsebool -P httpd_can_network_connect on
  when:
    - nginx_selinux_mode.rc == 0
    - nginx_selinux_mode.stdout in ["Enforcing", "Permissive"]
    - nginx_selinux_network_connect is defined
    - nginx_selinux_network_connect.stdout is search("--> off")

- name: Remove legacy local application proxy config
  ansible.builtin.file:
    path: /etc/nginx/conf.d/local-apps.conf
    state: absent
  notify: Reload Nginx

- name: Remove the default Nginx welcome site
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent
  notify: Reload Nginx

- name: Configure local application reverse proxies
  ansible.builtin.template:
    src: sites.conf.j2
    dest: /etc/nginx/conf.d/reverse-proxy.conf
    owner: root
    group: root
    mode: "0644"
  no_log: true
  notify: Reload Nginx

- name: Validate Nginx configuration and reject conflicting server names
  ansible.builtin.command:
    cmd: nginx -t
  register: nginx_config_test
  changed_when: false
  failed_when: >-
    nginx_config_test.rc != 0 or
    'conflicting server name' in (nginx_config_test.stdout + nginx_config_test.stderr)

- name: Ensure Nginx is enabled and running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
