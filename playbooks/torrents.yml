- name: Run torrent service
  hosts: torrent_servers
  gather_facts: false
  become: true
  roles:
    - docker_setup
    - role: nginx_proxy
      vars:
        nginx_proxy_sites:
          - server_name: torrents.choochoo.train
            upstream: 127.0.0.1:8080
            proxy_buffering: "off"
            proxy_read_timeout: 3600s
  tasks:
    - name: Create torrent service directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - path: /opt/localtorrents
          owner: "1000"
          group: "1000"
          mode: "0755"
        - path: /opt/localtorrents/config
          owner: "1000"
          group: "1000"
          mode: "0755"
        - path: /srv/downloads
          owner: "1000"
          group: "1000"
          mode: "0755"

    - name: Copy torrent Compose file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../images/local.torrents.compose.yml"
        dest: /opt/localtorrents/compose.yml
        mode: "0644"

    - name: Start torrent service
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: /opt/localtorrents
      register: torrent_compose
      changed_when: >-
        torrent_compose.stdout is search('Created|Started|Recreated|Removed') or
        torrent_compose.stderr is search('Created|Started|Recreated|Removed')
