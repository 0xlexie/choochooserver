name: localapps-securo

x-backend-environment: &backend-environment
  DATABASE_URL: postgresql+asyncpg://postgres:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/securo
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
  DEBUG: "false"
  FRONTEND_URL: http://securo.choochoo.train
  OPENEXCHANGERATES_APP_ID: ${OPENEXCHANGERATES_APP_ID:-}
  REDIS_URL: redis://redis:6379/0
  TRUSTED_PROXY_HOPS: "2"
  STORAGE_LOCAL_PATH: /app/data/attachments
  AGENTS_KNOWLEDGE_STORAGE_PATH: /app/data/agent_knowledge
  AGENTS_ENABLED: "false"

x-backend-base: &backend-base
  image: ghcr.io/securo-finance/securo-backend:0.17.0
  environment: *backend-environment
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  volumes:
    - attachments:/app/data/attachments
    - agent_knowledge:/app/data/agent_knowledge
  restart: unless-stopped

services:
  db:
    image: docker.io/pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: securo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d securo"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  migrate:
    <<: *backend-base
    entrypoint: ["alembic"]
    command: upgrade head
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend-base
    entrypoint: ["sh", "-c", 'alembic current --check-heads && exec "$$@"', "sh"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 5s
      timeout: 6s
      start_period: 30s
      retries: 12

  frontend:
    image: ghcr.io/securo-finance/securo-frontend:0.17.0
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      BACKEND_URL: http://backend:8000
      FRONTEND_URL: http://securo.choochoo.train
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  celery-worker:
    <<: *backend-base
    entrypoint: ["sh", "-c", 'alembic current --check-heads && exec "$$@"', "sh"]
    command: celery -A app.worker worker --loglevel=info --concurrency=2

  celery-beat:
    <<: *backend-base
    entrypoint: ["sh", "-c", 'alembic current --check-heads && exec "$$@"', "sh"]
    command: celery -A app.worker beat --loglevel=info

volumes:
  pgdata:
  attachments:
  agent_knowledge:
